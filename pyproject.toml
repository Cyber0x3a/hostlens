[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hostlens"
version = "0.1.0"
description = "High-level Python device discovery and identification for local networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HostLens contributors" }]
keywords = ["lan", "network", "discovery", "fingerprinting", "arp", "upnp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
]
dependencies = [
  "httpx>=0.27,<1",
  "ifaddr>=0.2,<1",
  "manuf>=1.1.5,<2",
  "pydantic>=2.7,<3",
  "rich>=13.7,<15",
  "scapy>=2.5,<3",
  "typer>=0.12,<1",
  "zeroconf>=0.132,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pre-commit>=3.7",
  "pyright>=1.1.380",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
hostlens = "hostlens.cli:app"

[project.urls]
Homepage = "https://github.com/cyber0x3a/hostlens"
Issues = "https://github.com/cyber0x3a/hostlens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hostlens"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["network: tests that require access to a local network"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
